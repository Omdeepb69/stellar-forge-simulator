name: Build Executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            sep: ":"
          - os: windows-latest
            platform: windows
            sep: ";"
          - os: macos-latest
            platform: macos
            sep: ":"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Prepare platform icon (Windows .ico)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          python - <<'EOF'
          from PIL import Image
          sizes = [(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)]
          imgs = [Image.open(f"assets/generated/ui/icon_{s[0]}.png").convert("RGBA") for s in sizes]
          imgs[-1].save("assets/generated/ui/icon.ico", format="ICO", sizes=sizes)
          EOF

      - name: Prepare platform icon (macOS .icns)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p StellarForge.iconset
          cp assets/generated/ui/icon_16.png  StellarForge.iconset/icon_16x16.png
          cp assets/generated/ui/icon_32.png  StellarForge.iconset/icon_16x16@2x.png
          cp assets/generated/ui/icon_32.png  StellarForge.iconset/icon_32x32.png
          cp assets/generated/ui/icon_64.png  StellarForge.iconset/icon_32x32@2x.png
          cp assets/generated/ui/icon_128.png StellarForge.iconset/icon_128x128.png
          cp assets/generated/ui/icon_256.png StellarForge.iconset/icon_128x128@2x.png
          cp assets/generated/ui/icon_256.png StellarForge.iconset/icon_256x256.png
          iconutil -c icns StellarForge.iconset -o assets/generated/ui/icon.icns

      - name: Build with PyInstaller
        shell: bash
        run: |
          ICON_ARG="assets/generated/ui/icon.png"
          EXTRA_ARGS="--onefile"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            ICON_ARG="assets/generated/ui/icon.ico"
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            ICON_ARG="assets/generated/ui/icon.icns"
            EXTRA_ARGS="--onedir"
          fi
          pyinstaller --noconfirm --clean --windowed $EXTRA_ARGS \
            --name StellarForge \
            --icon "$ICON_ARG" \
            --add-data "assets${{ matrix.sep }}assets" \
            main.py

      - name: Package Windows release
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/StellarForge.exe release/
          Compress-Archive -Path release/* -DestinationPath StellarForge-Windows.zip

      - name: Package Linux release
        if: matrix.platform == 'linux'
        run: |
          mkdir -p release
          cp dist/StellarForge release/
          cp assets/generated/ui/icon.png release/StellarForge.png
          cat > release/StellarForge.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Stellar Forge: The Last Voyager
          Exec=StellarForge
          Icon=StellarForge
          Categories=Game;
          Terminal=false
          DESKTOP
          tar -czf StellarForge-Linux.tar.gz -C release .

      - name: Package macOS release
        if: matrix.platform == 'macos'
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/StellarForge.app StellarForge-macOS.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StellarForge-${{ matrix.platform }}
          path: |
            StellarForge-Windows.zip
            StellarForge-Linux.tar.gz
            StellarForge-macOS.zip

  build-android:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Buildozer & dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ant autoconf automake autopoint build-essential \
            ccache cmake git lbzip2 libffi-dev libltdl-dev libncurses5-dev \
            libncursesw5-dev libssl-dev libtool lld patch pkg-config \
            python3-dev python3-venv texinfo unzip zip zlib1g-dev openjdk-17-jdk
          pip install git+https://github.com/kivy/buildozer.git Cython==0.29.36 meson ninja setuptools packaging

      - name: Build Android APK (debug)
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer.log
        timeout-minutes: 60

      - name: Show buildozer tail on failure
        if: failure()
        run: |
          tail -n 120 buildozer.log || true

      - name: Upload buildozer log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log

      - name: Rename APK
        run: |
          ls -la bin/
          APK=$(find bin -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" StellarForge-Android.apk

      - name: Verify pygame/surface.so symbols in APK
        run: |
          python - <<'EOF'
          import zipfile, tarfile, io, subprocess, tempfile, os
          z = zipfile.ZipFile("StellarForge-Android.apk")
          tf = tarfile.open(fileobj=io.BytesIO(z.read("lib/arm64-v8a/libpybundle.so")))
          with tempfile.TemporaryDirectory() as td:
              p = os.path.join(td, "surface.so")
              open(p, "wb").write(tf.extractfile("_python_bundle/site-packages/pygame/surface.so").read())
              out = subprocess.check_output(["nm", "-D", "-u", p]).decode()
              bad = [l.strip() for l in out.splitlines() if any(k in l for k in ("alphablit_", "pg_has_avx2", "pg_sse2", "pg_avx2", "pg_neon"))]
              print("Undefined SIMD symbols in surface.so:", bad)
              assert not bad, f"Missing SIMD symbols in pygame/surface.so: {bad}"
          EOF

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: StellarForge-android
          path: StellarForge-Android.apk

  release:
    needs: [build, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/StellarForge-Windows.zip
            artifacts/StellarForge-Linux.tar.gz
            artifacts/StellarForge-macOS.zip
            artifacts/StellarForge-Android.apk
          generate_release_notes: true
